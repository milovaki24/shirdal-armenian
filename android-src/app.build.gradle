plugins { id 'com.android.application' }
android {
    namespace 'com.shirdal.armenian'
    compileSdk 34
    defaultConfig {
        applicationId 'com.shirdal.armenian'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'html' }
}
