name: android-apk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble project
        run: |
          S=android-src; A=build-android
          mkdir -p $A/app/src/main/java/com/shirdal/armenian $A/app/src/main/res/values $A/app/src/main/assets/www
          cp $S/settings.gradle $S/gradle.properties $A/
          cp $S/root.build.gradle $A/build.gradle
          cp $S/app.build.gradle $A/app/build.gradle
          cp $S/AndroidManifest.xml $A/app/src/main/
          cp $S/MainActivity.java $A/app/src/main/java/com/shirdal/armenian/
          cp $S/strings.xml $A/app/src/main/res/values/
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p $A/app/src/main/res/mipmap-$d; cp $S/ic_$d.png $A/app/src/main/res/mipmap-$d/ic_launcher.png; done
          cp docs/index.html docs/icon-192.png $A/app/src/main/assets/www/
          sed -i "s#<script>if('serviceWorker'[^<]*</script>##" $A/app/src/main/assets/www/index.html
      - name: Build APK
        run: gradle -p build-android assembleRelease assembleDebug --no-daemon
      - name: Rename
        run: cp build-android/app/build/outputs/apk/release/app-release-unsigned.apk shirdal-armenian-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shirdal-armenian-apk
          path: |
            shirdal-armenian-unsigned.apk
            build-android/app/build/outputs/apk/debug/app-debug.apk
